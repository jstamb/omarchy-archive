name: Refresh timeline

# Rebuilds data/timeline.json from the Omarchy repo's releases and commits the
# result straight to main, which is what triggers the Cloudflare Pages build.
#
# Why an Action and not a Worker: the output is static content, so there is
# nothing to serve at runtime. This way the timeline is an ordinary reviewable
# commit in git — same pipeline as every other record — with no extra service,
# no external state, and no credentials beyond the token Actions already gives.
on:
  schedule:
    # 06:20 UTC daily. Off the hour so it isn't queued behind the world's cron.
    - cron: '20 6 * * *'
  workflow_dispatch:

# GITHUB_TOKEN only needs the API read; the commit goes out over the deploy key
# below, because the ruleset on main requires a pull request and GITHUB_TOKEN
# cannot bypass it (a user-owned repo cannot name the GitHub Actions app as a
# bypass actor — only a deploy key, a role, or a team).
permissions:
  contents: read

# A manual run during a scheduled one would race on the same file.
concurrency:
  group: timeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # ssh-key, not the default token: a push authenticated by the
      # timeline-refresh deploy key is the one actor allowed past the pull
      # request rule on main. It also means this commit triggers Validate,
      # which a GITHUB_TOKEN push would not.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.TIMELINE_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The pre-ingest tip. ingest-timeline.mjs rewrites data/timeline.json in
      # place, so HEAD before this run is the baseline the refreshed file must
      # be measured against — no published release may drop out of the history.
      - name: Record the pre-ingest baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch releases and re-tier
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bot/ingest-timeline.mjs

      # Preservation before validation, and before anything is committed. The
      # refresh is a full rewrite, so a GitHub API shape change that silently
      # dropped releases could still parse and validate; comparing the rewritten
      # file to the pre-ingest tip is what catches a shrink or a vanished
      # version id. A failure here leaves main untouched.
      - name: Preserve published records
        run: node bot/preserve.mjs --base "${{ steps.baseline.outputs.sha }}"

      # The gate. Nobody reads this diff before it deploys, so if the GitHub API
      # shape changes and the parse degrades — no nodes, wrong order, a bogus
      # contributor URL — the run fails here and main is left alone.
      - name: Validate
        run: node bot/validate.mjs

      - name: Build
        run: npm run build

      - name: Commit if the history moved
        run: |
          set -euo pipefail
          git config user.name  "omarchy-archive-bot"
          git config user.email "bot@omarchyarchive.com"

          # Stage first, then compare against the index. `git diff` alone
          # reports nothing for an untracked file, so if timeline.json were ever
          # missing from the repo this step would silently skip forever.
          git add data/timeline.json

          # meta.json is only stamped when a content file actually moved, so an
          # unchanged timeline leaves it alone. Still gated on timeline.json:
          # nothing else in this run is a reason to deploy.
          if git diff --cached --quiet -- data/timeline.json; then
            echo "No release changes." >> "$GITHUB_STEP_SUMMARY"
            git restore --staged data/timeline.json 2>/dev/null || true
            exit 0
          fi

          NODES=$(node -e "const t=require('./data/timeline.json');console.log(t.filter(r=>r.tier==='node').length)")
          TOTAL=$(node -e "console.log(require('./data/timeline.json').length)")
          LATEST=$(node -e "console.log(require('./data/timeline.json')[0].version)")

          git add data/meta.json
          git commit -m "content: refresh Omarchy release timeline

          ${TOTAL} releases, ${NODES} milestones, newest v${LATEST}."
          # A plain push, never --force: if main moved under us (a content
          # commit landed first) this is rejected as non-fast-forward and the
          # run fails here rather than overwriting it. The next scheduled run
          # picks the change up.
          git push

          {
            echo "### Timeline updated"
            echo ""
            echo "- newest release: **v${LATEST}**"
            echo "- ${TOTAL} releases, ${NODES} milestones"
            echo ""
            echo "Pushed to main; Cloudflare Pages is rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
