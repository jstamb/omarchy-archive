# Cloudflare Pages. Static Astro output plus Pages Functions under functions/.
#
# Function: functions/api/ingest-x-trigger.js → POST /api/ingest-x-trigger
#   GitHub Action auth → forwards to Omarchy Bot webhook (no X secrets).
#
# Encrypted Secrets to set in Pages → Settings → Variables and Secrets
# (never put values in this file or a [vars] block — wrangler.toml is committed;
# plaintext vars are managed from here when present, secrets must stay encrypted):
#   INGEST_X_TRIGGER_SECRET   — shared with GitHub Actions secret of the same name
#   OMARCHY_BOT_WEBHOOK_URL   — POST URL from Omarchy Bot routine panel
#                               (scrape-x-via-webhook-trigger)
#   OMARCHY_BOT_WEBHOOK_SECRET — sender key (crsr_…) from the same panel;
#                               sent as Authorization: Bearer (official) and
#                               also as X-Webhook-Secret
#
name = "omarchy-archive"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"
